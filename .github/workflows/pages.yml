name: Deploy HealthSense to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -R public/. _site/
          # Register the API service-worker bridge on every HTML page.
          python - <<'PY'
          from pathlib import Path
          registration = '''<script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js', {scope: './'}).catch(console.error)); }</script>'''
          for path in Path('_site').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'navigator.serviceWorker.register' not in text:
                  text = text.replace('</body>', registration + '</body>')
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
