name: Deploy HealthSense to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -R public/. _site/
          python - <<'PY'
          from pathlib import Path

          shim = '''<script>
          (() => {
            const originalFetch = window.fetch.bind(window);
            const base = window.location.pathname.startsWith('/HealthSense/') ? '/HealthSense/' : '/';
            window.fetch = (input, init) => {
              if (typeof input === 'string' && input.startsWith('/api/')) {
                input = base.replace(/\/$/, '') + input;
              } else if (input instanceof Request && new URL(input.url).pathname.startsWith('/api/')) {
                const u = new URL(input.url);
                u.pathname = base.replace(/\/$/, '') + u.pathname;
                input = new Request(u, input);
              }
              return originalFetch(input, init);
            };
          })();
          </script>'''

          registration = '''<script>
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js', {scope: './'}).catch(console.error));
          }
          </script>'''

          for path in Path('_site').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'const originalFetch' not in text:
                  text = text.replace('</head>', shim + '</head>')
              if 'navigator.serviceWorker.register' not in text:
                  text = text.replace('</body>', registration + '</body>')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
